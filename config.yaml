---
# ♊ OsSetupHelper Configuration
# This file defines which apps, tools, and settings will be applied to your system.

meta:
  version: "1.0"
  profile: "default"

execution:
  # If true, Ansible will always run with 'become: true' (sudo). 
  # Recommended to keep false and use -K if needed.
  always_elevated: false
  # If true, runs Ansible in check mode (dry run) without making changes.
  check_mode: false

selections:
  # GUI Applications
  # Syntax:
  #   role_name: true/false          (Short form)
  #   role_name: { enabled: true }   (Full form)
  apps:
    chrome: 
      enabled: false
      add_to_dock: true
    vscode:
      enabled: false
      # Automatically add to macOS Dock
      add_to_dock: true
      # List of VS Code extensions to install
      extensions:
        - ms-python.python
        - redhat.ansible
    sourcetree: false
    jetbrains_toolbox: 
      enabled: false
      # List of JetBrains IDEs to install via Toolbox
      ide_list:
        - PyCharm
        - IntelliJ IDEA
        - Android Studio
    sublime: false
    steam: false
    discord: 
      enabled: true
    spotify: 
      enabled: true
    notion: 
      enabled: true
    postman: false
    slack: 
      enabled: true
    obs_studio: 
      enabled: true
    docker_desktop: false
    freedownloadmanager: 
      enabled: true
    localsend: 
      enabled: true
    wechat: 
      enabled: true
    google_drive: 
      enabled: true
    pixpin: false
    ai:
      enabled: true
      opencode:
        enabled: true
        add_to_dock: true
      ollama: true
      omlx: true
      skills:
        enabled: true
        symlink: true
        symlink_src: "~/.config/agent/skills"
        symlink_dst:
          - ~/.claude/skills
          # If omitted/empty, auto-detects from installed agents:
          # - ~/.gemini/skills
          # - ~/.cursor/skills
          # - ~/.codex/skills
        agent_skills: true
        # Skills can be listed as a dict under items: (syntax 1) or as a list (syntax 2)
        items:
          ponytail: true
          headroom: true
          taste_skill: true
          archify: true
          codex_with_chatgpt: true
          reverse_skill: true
      others:
        enabled: true
        items:
          aoci_code: true
          symphony: true
          codex_chatgpt_web: true
          omniroute: true
          graphify: true
    
    # macOS Specific Apps
    iterm: 
      enabled: true
    charles: 
      enabled: true
    betterdisplay: 
      enabled: true
    stats: false
    appcleaner: false
    macs_fan_control: false
    displaylink_manager: false
    handbrake: false
    iina: 
      enabled: true
    raycast: 
      enabled: true
    xcode: 
      enabled: true
      add_to_dock: true
    utm: true
    macshot: true
    crisp: true
    vorssaint: true
    rectangle: true
    applite: true
    otty: true

    # Linux Specific Apps
    gnome_tweaks: true
    gnome_shell_extensions: true

    # Windows Specific Apps
    wsl2: true
    windows_terminal: true
    winget: true

  # Command-line Tools
  cli:
    nodejs: false
    gh: true
    zsh_ohmyzsh:
      enabled: true
      # Where to install Oh My Zsh
      custom_paths:
        install_dir: "~/.config/ohmyzsh"
    opencode: false
    gemini: false
    claudcode: false
    openjdk-latest: true
    openjdk-17: false
    
    # macOS Specific CLI
    mole: false
    mist_cli: false

    # Windows Specific CLI (moved from apps: — its mac package is a
    # Homebrew formula, not a cask, so it lives under cli/ not apps/)
    powershell: true

  # System Settings & Optimizations
  settings:
    setup_ssh_git:
      enabled: false
      # Git global configuration
      user_name: "Your Name"
      user_email: "your.email@example.com"
      # GitHub usernames to trust SSH keys from (fetched via API)
      github_trust_keys:
        - hereisderek
    
    setup_environment:
      enabled: false
      # Custom shell commands to add to ~/.config/env/env.sh
      env_sh: |
        # managed by ossetuphelper
        export PATH="$HOME/.local/bin:$PATH"
      app_files: {}
      
    macos_tweaks:
      enabled: false
      # Optional: custom hostname for the machine
      hostname: ""
      # Remove known Apple stock apps from the Dock (Safari, Mail, Messages,
      # Maps, Photos, FaceTime, Calendar, Contacts, Reminders, Notes,
      # Freeform, Music, TV, Podcasts, News, App Store). Keeps Finder,
      # Launchpad/Apps, System Settings, and Trash.
      clean_dock_icons: true
      # Dock position on screen ('left', 'bottom', 'right', or omitted/null/skip to skip)
      # dock_location: "left"
      # Dock icon size in pixels (e.g. 48, or omitted/null/skip to skip)
      # dock_size: 48
      # Set the main display's scaled resolution to "More Space" (the
      # largest HiDPI mode) via displayplacer. Off by default — a real
      # resolution change, not something to apply silently.
      display_more_space: false
      # Enable right-click on Apple mouse/trackpad
      allow_mouse_right_click: true
      # Swap Cmd and Opt keys on external (non-Apple) keyboards
      swap_external_keyboard_cmd_opt: false
      # Enable/disable tap-to-click on trackpad (true = enable, false = disable, omitted/null/skip = skip)
      # allow_tap_to_click: true
      # Show hidden files in Finder
      show_hidden_files: false
      # Show all file extensions in Finder
      show_all_filename_extensions: false
      # Disable the "are you sure" warning when renaming a file's extension
      warn_on_extension_change: false
      # Enable three-finger drag
      allow_three_finger_drag: false
      # Default Finder view to 'List'
      folder_list_view: true
      # Default Finder new window location to Home folder (true = Home, false = Recents, omitted/null/skip = skip)
      # finder_default_location_home: true
      # Finder search defaults to current folder (true = current folder, false = this Mac, null/skip = skip)
      search_current_folder: true

      # Show icons on desktop
      show_desktop_hard_drives: true
      show_desktop_external_drives: true
      show_desktop_removable_media: true
      # Position icon labels on the right
      desktop_icons_right_label: true
      # Show additional item info on desktop icons
      desktop_icons_show_info: true
      # Show battery percentage in menu bar
      show_battery_percentage: true
      # Show volume indicator in menu bar
      show_volume_menu_bar: true
      # Set Oh My Zsh to auto-update
      omz_auto_update: true
      # Enable comments in interactive Zsh sessions
      zsh_interactive_comments: true
